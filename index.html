<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#fdf6f4" />
    <meta
      name="description"
      content="Your people. Your game night. Play party games together using your phones and a shared screen."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Party · Good company</title>
    <script>
      try {
        const t = localStorage.getItem("party.theme");
        document.documentElement.classList.toggle(
          "dark",
          t === "dark" ||
            ((!t || t === "system") &&
              matchMedia("(prefers-color-scheme: dark)").matches),
        );
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
